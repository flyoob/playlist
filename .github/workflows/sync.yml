name: Sync GitHub to Gitee

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请修改此处
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: "flyoob"  # 请确保这里是你的 Gitee 用户名或注册邮箱
          DEST_REPO: "gitee.com/flyoob/playlist.git"
        run: |
          git remote add gitee https://${{ env.GITEE_USER }}:${{ env.GITEE_TOKEN }}@${{ env.DEST_REPO }}
          git push --force gitee main:main  # 如果是 master 分支请把两个 main 改为 master