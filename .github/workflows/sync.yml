name: Sync GitHub to Gitee

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请改成 master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        uses: wearerequired/git-mirror-action@v1
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }} # 如果用密码/Token可以忽略这行，用下面的
        with:
          source-repo: ""
          destination-repo: "https://gitee.com/flyoob/playlist.git"
          user: "525496107@qq.com"
          password: ${{ secrets.GITEE_PASSWORD }}